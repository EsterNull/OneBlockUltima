name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'forge_1.7.10'
      - 'forge_1.12.x'
      - 'forge_1.21.x'
      - 'feature_*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read java version
        id: version
        run: |
          JAVA_VER=$(grep "^ci.java.version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "java_version=$JAVA_VER" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.version.outputs.java_version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-home-cache-includes: |
            caches
            wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew unitTest
