buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = '3.0.0'
group = 'ru.defea.oneblockultima'
archivesBaseName = 'OneBlockUltima-forge-1.7.10'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

compileJava {
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

compileTestJava {
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    mappings = "stable_12"
}

dependencies {
    compile fileTree(dir: 'libs', include: '*.jar')
    testCompile 'junit:junit:4.12'
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.7.10"

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.7.10'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar.finalizedBy('reobf')

gradle.projectsEvaluated {
    ['runClient', 'debugClient'].each { name ->
        tasks."$name" {
            classpath = sourceSets.main.runtimeClasspath
            args += ['--username', 'DevPlayer']
        }
    }
    ['runServer', 'debugServer'].each { name ->
        tasks."$name" {
            classpath = sourceSets.main.runtimeClasspath
        }
    }
}

processResources.doLast {
    copy {
        from sourceSets.main.output.resourcesDir
        into sourceSets.main.java.outputDir
    }
}

import net.minecraftforge.gradle.delayed.DelayedString

tasks.downloadClient.url = new DelayedString(project, "https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar")
tasks.downloadServer.url = new DelayedString(project, "https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar")
tasks.getAssetsIndex.url = new DelayedString(project, "https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json")
tasks.getVersionJson.url = new DelayedString(project, "https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json")
