 plugins {
      id 'net.minecraftforge.gradle' version '7.0.2'
     id 'java'
     id 'eclipse'
     id 'maven-publish'
 }

version = '3.0.0-1b'
group = 'ru.defea.oneblockultima'
base.archivesName = 'OneBlockUltima-forge-1.21.x'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            args '--username', 'Dev'
        }

        server {
            args '--nogui'
        }

        data {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', 'oneblockultima', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
sourceSets.main.java.destinationDirectory = sourceSets.main.output.resourcesDir

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.1-52.1.16')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

jar {
    manifest {
        attributes(['Specification-Title'     : 'oneblockultima',
                    'Specification-Vendor'    : 'defea',
                    'Specification-Version'   : '1',
                    'Implementation-Title'   : project.base.archivesName,
                    'Implementation-Version' : project.version,
                    'Implementation-Vendor'  : 'defea'])
    }
}

test {
    useJUnit()
    enabled = false
}

tasks.register('unitTest', JavaExec) {
    group = 'verification'
    description = 'Run JUnit4 tests via JUnitCore. Default: all *Test classes from the test source set. Override selection with --args="com.example.FooTest BarTest".'
    dependsOn tasks.named('compileTestJava')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.junit.runner.JUnitCore'

    def allTestClasses = {
        def found = new TreeSet<String>()
        sourceSets.test.java.srcDirs.findAll { it.directory }.each { srcDir ->
            fileTree(dir: srcDir, include: '**/*Test.java').visit { detail ->
                if (!detail.isDirectory()) {
                    def rel = detail.relativePath.pathString
                    def fqcn = rel.substring(0, rel.length() - '.java'.length()).replace('/', '.').replace('\\', '.')
                    if (!fqcn.contains('$')) {
                        found.add(fqcn)
                    }
                }
            }
        }
        found.toList()
    }

    args(allTestClasses())
}

tasks.named('check') {
    dependsOn tasks.named('unitTest')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [version: project.version]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') {
        expand(props)
    }
}
